name: languages

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node .github/langs.mjs profile/langs.svg
        env:
          LANGS_TOKEN: ${{ secrets.GRS_TOKEN }}

      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/langs.svg
          git commit -m "update languages" || exit 0
          git push
